{% extends 'base.html' %}

{% block title %}Attendance Filters{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1 text-primary">Attendance Filters</h2>
        <p class="text-secondary mb-0">Select the employees, dates, months, or weeks you want to view.</p>
    </div>
    <a class="btn btn-outline-secondary" href="{% url 'attendance:dashboard' %}">Back to Dashboard</a>
</div>

<form id="filters-form" class="card shadow-sm">
    <div class="card-body p-4">
        <div class="row g-4">
            <div class="col-md-3">
                <label class="form-label fw-semibold">Employee Name / ID</label>
                <div class="dropdown">
                    <button id="employee-button" class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">All employees</button>
                    <div class="dropdown-menu p-3 w-100 shadow" style="min-width: 280px;">
                        <input class="form-control form-control-sm mb-2" type="search" placeholder="Search name or ID" oninput="searchOptions('employee-options', this.value)">
                        <div class="form-check border-bottom pb-2 mb-2">
                            <input id="employee-all" class="form-check-input" type="checkbox" checked onchange="toggleAll('employee-options', this.checked)">
                            <label class="form-check-label fw-semibold" for="employee-all">(Select All)</label>
                        </div>
                        <div id="employee-options" class="filter-options"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-semibold">Date</label>
                <div class="dropdown">
                    <button id="date-button" class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">All dates</button>
                    <div class="dropdown-menu p-3 shadow" style="min-width: 300px; max-width: 320px;">
                        <div id="calendar-picker"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-semibold">Month / Year</label>
                <div class="dropdown">
                    <button id="month-button" class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">All months</button>
                    <div class="dropdown-menu p-3 w-100 shadow" style="min-width: 250px;">
                        <input class="form-control form-control-sm mb-2" type="search" placeholder="Search month" oninput="searchOptions('month-options', this.value)">
                        <div class="form-check border-bottom pb-2 mb-2">
                            <input id="month-all" class="form-check-input" type="checkbox" checked onchange="toggleAll('month-options', this.checked)">
                            <label class="form-check-label fw-semibold" for="month-all">(Select All)</label>
                        </div>
                        <div id="month-options" class="filter-options"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <label for="week-filter" class="form-label fw-semibold">Week</label>
                <select id="week-filter" class="form-select">
                    <option value="">All weeks</option>
                </select>
            </div>
        </div>
    </div>
    <div class="card-footer bg-white d-flex gap-2 justify-content-end">
        <button id="reset-filters" class="btn btn-outline-secondary" type="button">Reset Filters</button>
        <button class="btn btn-primary" type="submit"><i class="fa-solid fa-check me-1"></i>Apply Filters</button>
    </div>
</form>

<style>
    .filter-options { max-height: 230px; overflow-y: auto; }
    .filter-options .form-check { margin-bottom: .35rem; }
    
    /* Calendar Picker Styles */
    .calendar-container {
        font-family: inherit;
        user-select: none;
    }
    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .calendar-title-wrapper {
        display: flex;
        align-items: center;
        gap: 4px;
        position: relative;
    }
    .calendar-title {
        font-weight: 600;
        font-size: 0.95rem;
        color: #2d3748;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .calendar-title:hover {
        color: var(--primary-color);
    }
    .calendar-arrows {
        display: flex;
        gap: 8px;
    }
    .calendar-arrow-btn {
        background: none;
        border: none;
        color: #718096;
        cursor: pointer;
        padding: 2px 6px;
        font-size: 0.9rem;
        font-weight: bold;
        border-radius: 4px;
        transition: background 0.15s, color 0.15s;
    }
    .calendar-arrow-btn:hover {
        background-color: #edf2f7;
        color: #2d3748;
    }
    .calendar-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-weight: 600;
        font-size: 0.8rem;
        color: #718096;
        margin-bottom: 6px;
    }
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
    }
    .calendar-day {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
        position: relative;
        border: 1px solid transparent;
        background: none;
        padding: 0;
        color: #2d3748;
    }
    .calendar-day:hover:not(.disabled) {
        background-color: #edf2f7;
    }
    .calendar-day.other-month {
        color: #cbd5e0;
    }
    .calendar-day.has-data {
        font-weight: 600;
    }
    .calendar-day.has-data::after {
        content: '';
        position: absolute;
        bottom: 3px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: var(--primary-color);
    }
    .calendar-day.selected {
        background-color: #4a5568 !important;
        color: #ffffff !important;
        border: 2px solid #1a202c !important;
        font-weight: bold;
    }
    .calendar-day.selected.has-data::after {
        background-color: #ffffff;
    }
    .calendar-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #e2e8f0;
    }
    .calendar-footer-btn {
        background: none;
        border: none;
        font-size: 0.85rem;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        text-decoration: none;
    }
    .calendar-footer-btn.clear {
        color: #718096;
    }
    .calendar-footer-btn.clear:hover {
        color: #2d3748;
        background-color: #edf2f7;
    }
    .calendar-footer-btn.select {
        color: var(--primary-color);
        font-weight: 600;
    }
    .calendar-footer-btn.select:hover {
        background-color: #ebf8ff;
    }
    
    .calendar-month-year-popover {
        position: absolute;
        top: 100%;
        left: 0;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        z-index: 10;
        padding: 10px;
        width: 180px;
        display: none;
    }
    .calendar-month-year-popover.show {
        display: block;
    }
    .popover-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 8px;
    }
    .popover-item {
        font-size: 0.8rem;
        padding: 4px;
        text-align: center;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .popover-item:hover {
        background-color: #edf2f7;
    }
    .popover-item.active {
        background-color: var(--primary-color);
        color: white;
    }
    .popover-year-input {
        width: 100%;
        font-size: 0.85rem;
        padding: 4px 8px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        text-align: center;
    }
</style>

<script>
    const params = new URLSearchParams(window.location.search);
    const selectedValues = {
        employees: new Set((params.get('employees') || '').split(',').filter(Boolean)),
        dates: new Set((params.get('dates') || '').split(',').filter(Boolean)),
        months: new Set((params.get('months') || '').split(',').filter(Boolean))
    };

    function formatDateLocal(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    class CalendarPicker {
        constructor(containerId, options = {}) {
            this.container = document.getElementById(containerId);
            this.selectedDates = new Set(options.selectedDates || []);
            this.availableDates = new Set(options.availableDates || []);
            
            let defaultDate = new Date();
            if (this.selectedDates.size > 0) {
                defaultDate = new Date([...this.selectedDates][0] + 'T00:00:00');
            } else if (this.availableDates.size > 0) {
                const sortedDates = [...this.availableDates].sort();
                defaultDate = new Date(sortedDates[sortedDates.length - 1] + 'T00:00:00');
            }
            
            this.currentYear = defaultDate.getFullYear();
            this.currentMonth = defaultDate.getMonth();
            
            this.onSelect = options.onSelect || (() => {});
            this.onClear = options.onClear || (() => {});
            
            this.months = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            
            this.init();
        }
        
        init() {
            this.container.innerHTML = `
                <div class="calendar-container">
                    <div class="calendar-header">
                        <div class="calendar-title-wrapper">
                            <div class="calendar-title" id="cal-month-year-title">
                                <span id="cal-month-year-text">Month, Year</span>
                                <i class="fa-solid fa-caret-down fs-8 ms-1"></i>
                            </div>
                            <div class="calendar-month-year-popover" id="cal-popover"></div>
                        </div>
                        <div class="calendar-arrows">
                            <button class="calendar-arrow-btn" type="button" id="cal-prev" title="Previous Month">↑</button>
                            <button class="calendar-arrow-btn" type="button" id="cal-next" title="Next Month">↓</button>
                        </div>
                    </div>
                    <div class="calendar-weekdays">
                        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                    </div>
                    <div class="calendar-grid" id="cal-days-grid"></div>
                    <div class="calendar-footer">
                        <button class="calendar-footer-btn clear" type="button" id="cal-clear">Clear</button>
                        <button class="calendar-footer-btn select" type="button" id="cal-submit">Select</button>
                    </div>
                </div>
            `;
            
            this.titleElement = this.container.querySelector('#cal-month-year-title');
            this.titleText = this.container.querySelector('#cal-month-year-text');
            this.popoverElement = this.container.querySelector('#cal-popover');
            this.daysGrid = this.container.querySelector('#cal-days-grid');
            
            this.setupGeneralEvents();
            this.updateCalendar();
        }
        
        setupGeneralEvents() {
            this.container.querySelector('#cal-prev').addEventListener('click', (e) => {
                e.stopPropagation();
                this.navigateMonth(-1);
            });
            this.container.querySelector('#cal-next').addEventListener('click', (e) => {
                e.stopPropagation();
                this.navigateMonth(1);
            });
            
            this.titleElement.addEventListener('click', (e) => {
                e.stopPropagation();
                this.togglePopover();
            });
            
            this.container.querySelector('#cal-clear').addEventListener('click', (e) => {
                e.stopPropagation();
                this.selectedDates.clear();
                this.updateCalendar();
                this.onClear();
            });
            
            this.container.querySelector('#cal-submit').addEventListener('click', (e) => {
                e.stopPropagation();
                this.onSelect(this.selectedDates);
                
                const dateBtn = document.getElementById('date-button');
                const dropdown = bootstrap.Dropdown.getInstance(dateBtn) || new bootstrap.Dropdown(dateBtn);
                dropdown.hide();
            });
            
            this.container.addEventListener('click', () => {
                this.popoverElement.classList.remove('show');
            });
        }
        
        navigateMonth(direction) {
            this.currentMonth += direction;
            if (this.currentMonth < 0) {
                this.currentMonth = 11;
                this.currentYear -= 1;
            } else if (this.currentMonth > 11) {
                this.currentMonth = 0;
                this.currentYear += 1;
            }
            this.updateCalendar();
        }
        
        togglePopover() {
            this.popoverElement.classList.toggle('show');
            if (this.popoverElement.classList.contains('show')) {
                this.renderPopover();
            }
        }
        
        renderPopover() {
            this.popoverElement.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2" onclick="event.stopPropagation()">
                    <button class="btn btn-sm btn-light p-1 popover-year-btn" type="button" id="pop-year-prev">&larr;</button>
                    <input class="popover-year-input fw-semibold" type="number" id="pop-year-input" min="2000" max="2100" value="${this.currentYear}">
                    <button class="btn btn-sm btn-light p-1 popover-year-btn" type="button" id="pop-year-next">&rarr;</button>
                </div>
                <div class="popover-grid">
                    ${this.months.map((m, idx) => `
                        <div class="popover-item ${idx === this.currentMonth ? 'active' : ''}" data-month="${idx}">
                            ${m.slice(0, 3)}
                        </div>
                    `).join('')}
                </div>
            `;
            
            const yearInput = this.popoverElement.querySelector('#pop-year-input');
            yearInput.addEventListener('change', (e) => {
                const val = parseInt(e.target.value);
                if (val >= 2000 && val <= 2100) {
                    this.currentYear = val;
                    this.updateCalendar();
                }
            });
            
            this.popoverElement.querySelector('#pop-year-prev').addEventListener('click', (e) => {
                e.stopPropagation();
                this.currentYear -= 1;
                yearInput.value = this.currentYear;
                this.updateCalendar();
            });
            
            this.popoverElement.querySelector('#pop-year-next').addEventListener('click', (e) => {
                e.stopPropagation();
                this.currentYear += 1;
                yearInput.value = this.currentYear;
                this.updateCalendar();
            });
            
            this.popoverElement.querySelectorAll('.popover-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.currentMonth = parseInt(item.dataset.month);
                    this.popoverElement.classList.remove('show');
                    this.updateCalendar();
                });
            });
        }
        
        updateCalendar() {
            this.titleText.textContent = `${this.months[this.currentMonth]}, ${this.currentYear}`;
            
            const days = this.generateDays();
            this.daysGrid.innerHTML = days.map(d => {
                const dateStr = formatDateLocal(d.date);
                const isSelected = this.selectedDates.has(dateStr);
                const hasData = this.availableDates.has(dateStr);
                const classes = ['calendar-day'];
                if (!d.isCurrentMonth) classes.push('other-month');
                if (isSelected) classes.push('selected');
                if (hasData) classes.push('has-data');
                
                return `
                    <button class="${classes.join(' ')}" type="button" data-date="${dateStr}">
                        ${d.dayNum}
                    </button>
                `;
            }).join('');
            
            this.daysGrid.querySelectorAll('.calendar-day').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dateStr = btn.dataset.date;
                    const clickedDate = new Date(dateStr + 'T00:00:00');
                    
                    if (clickedDate.getMonth() !== this.currentMonth || clickedDate.getFullYear() !== this.currentYear) {
                        this.currentMonth = clickedDate.getMonth();
                        this.currentYear = clickedDate.getFullYear();
                    }
                    
                    if (this.selectedDates.has(dateStr)) {
                        this.selectedDates.delete(dateStr);
                    } else {
                        this.selectedDates.add(dateStr);
                    }
                    this.updateCalendar();
                    this.onSelect(this.selectedDates);
                });
            });
        }
        
        generateDays() {
            const firstDayOfMonth = new Date(this.currentYear, this.currentMonth, 1);
            const lastDayOfMonth = new Date(this.currentYear, this.currentMonth + 1, 0);
            const daysInMonth = lastDayOfMonth.getDate();
            
            const startDayOfWeek = firstDayOfMonth.getDay();
            const days = [];
            
            const prevMonthLastDay = new Date(this.currentYear, this.currentMonth, 0).getDate();
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                const d = prevMonthLastDay - i;
                const prevMonthDate = new Date(this.currentYear, this.currentMonth - 1, d);
                days.push({
                    date: prevMonthDate,
                    dayNum: d,
                    isCurrentMonth: false
                });
            }
            
            for (let d = 1; d <= daysInMonth; d++) {
                const currentDate = new Date(this.currentYear, this.currentMonth, d);
                days.push({
                    date: currentDate,
                    dayNum: d,
                    isCurrentMonth: true
                });
            }
            
            const totalCells = 42;
            const remainingCells = totalCells - days.length;
            for (let d = 1; d <= remainingCells; d++) {
                const nextMonthDate = new Date(this.currentYear, this.currentMonth + 1, d);
                days.push({
                    date: nextMonthDate,
                    dayNum: d,
                    isCurrentMonth: false
                });
            }
            
            return days;
        }
    }

    function renderOptions(containerId, options, selected, label) {
        const container = document.getElementById(containerId);
        container.innerHTML = options.map(option => `
            <div class="form-check option-item">
                <input class="form-check-input" type="checkbox" value="${option.value}" id="${containerId}-${option.value}" ${selected.has(option.value) ? 'checked' : ''} onchange="updateFilterButton('${containerId}', '${label}')">
                <label class="form-check-label" for="${containerId}-${option.value}">${option.label}</label>
            </div>
        `).join('');
        if (!selected.size) toggleAll(containerId, true);
        updateFilterButton(containerId, label);
    }

    function searchOptions(containerId, text) {
        const query = text.toLowerCase();
        document.querySelectorAll(`#${containerId} .option-item`).forEach(item => {
            item.classList.toggle('d-none', !item.textContent.toLowerCase().includes(query));
        });
    }

    function toggleAll(containerId, checked) {
        document.querySelectorAll(`#${containerId} input`).forEach(input => input.checked = checked);
        const label = containerId === 'employee-options' ? 'employee' : (containerId === 'month-options' ? 'month' : 'date');
        updateFilterButton(containerId, label);
    }

    function updateFilterButton(containerId, label) {
        const inputs = [...document.querySelectorAll(`#${containerId} input`)];
        const selected = inputs.filter(input => input.checked);
        const allCheckbox = document.getElementById(`${label}-all`);
        if (allCheckbox) {
            allCheckbox.checked = selected.length === inputs.length;
        }
        document.getElementById(`${label}-button`).textContent = selected.length === inputs.length ? `All ${label}s` : `${selected.length} ${label}${selected.length === 1 ? '' : 's'} selected`;
    }

    function updateDateFilterButton() {
        if (!window.calendar) return;
        const selectedCount = window.calendar.selectedDates.size;
        const button = document.getElementById('date-button');
        
        const isAll = selectedCount === 0 || selectedCount === window.calendar.availableDates.size;
        
        if (isAll) {
            button.textContent = 'All dates';
        } else if (selectedCount === 1) {
            const singleDateStr = [...window.calendar.selectedDates][0];
            const parts = singleDateStr.split('-');
            button.textContent = `${parts[2]}-${parts[1]}-${parts[0]}`;
        } else {
            button.textContent = `${selectedCount} dates selected`;
        }
    }

    function checkedValues(containerId) {
        return [...document.querySelectorAll(`#${containerId} input:checked`)].map(input => input.value);
    }

    async function loadFilterOptions() {
        const response = await fetch('/api/filters/');
        if (!response.ok) throw new Error('Unable to load filter options.');
        const data = await response.json();
        renderOptions('employee-options', data.employees.map(employee => ({ value: employee.id, label: `${employee.name} (${employee.id})` })), selectedValues.employees, 'employee');
        
        // Extract unique months from available dates
        const monthMap = {};
        data.available_dates.forEach(d => {
            const monthVal = d.value.slice(0, 7); // e.g. "2026-07"
            if (!monthMap[monthVal]) {
                const dateObj = new Date(monthVal + '-01T00:00:00');
                const label = dateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                monthMap[monthVal] = label;
            }
        });
        
        const monthOptions = Object.entries(monthMap)
            .sort((a, b) => b[0].localeCompare(a[0]))
            .map(([value, label]) => ({ value, label }));
            
        renderOptions('month-options', monthOptions, selectedValues.months, 'month');
        
        // Initialize Calendar Picker
        window.calendar = new CalendarPicker('calendar-picker', {
            selectedDates: selectedValues.dates,
            availableDates: data.available_dates.map(d => d.value),
            onSelect: (selectedDates) => {
                updateDateFilterButton();
            },
            onClear: () => {
                updateDateFilterButton();
            }
        });
        updateDateFilterButton();
        
        data.weeks.forEach(week => document.getElementById('week-filter').add(new Option(week, week)));
        document.getElementById('week-filter').value = params.get('weeks') || '';
    }

    document.getElementById('filters-form').addEventListener('submit', event => {
        event.preventDefault();
        const dashboardParams = new URLSearchParams();
        const employees = checkedValues('employee-options');
        const employeeCount = document.querySelectorAll('#employee-options input').length;
        if (employees.length && employees.length !== employeeCount) dashboardParams.set('employees', employees.join(','));
        
        if (window.calendar) {
            const dates = [...window.calendar.selectedDates];
            if (dates.length) dashboardParams.set('dates', dates.join(','));
        }
        
        const months = checkedValues('month-options');
        const monthCount = document.querySelectorAll('#month-options input').length;
        if (months.length && months.length !== monthCount) dashboardParams.set('months', months.join(','));
        
        if (document.getElementById('week-filter').value) dashboardParams.set('weeks', document.getElementById('week-filter').value);
        dashboardParams.set('refresh', '1');
        window.location.href = `/?${dashboardParams.toString()}`;
    });

    document.getElementById('reset-filters').addEventListener('click', () => window.location.href = '/filters/');
    loadFilterOptions().catch(error => alert(error.message));
</script>
{% endblock %}
