{% extends 'base.html' %}

{% block title %} Live Attendance{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <h2 class="fw-bold mb-0 text-primary">Live Dashboard</h2>
    <div class="d-flex gap-2 align-items-center">
        <a class="btn btn-outline-secondary" href="{% url 'attendance:dashboard' %}?refresh=1">
            <i class="fa-solid fa-house me-1"></i>Home
        </a>
        <button id="live-button" class="btn btn-outline-danger d-flex align-items-center gap-2" type="button" onclick="toggleLiveMode()">
            <span id="live-dot" class="rounded-circle bg-danger" style="width: 8px; height: 8px; display: inline-block;"></span>
            <span>Live</span>
        </button>
        <button id="refresh-button" class="btn btn-outline-primary" type="button" onclick="refreshDashboard(true)">
            <i class="fa-solid fa-arrows-rotate me-1"></i>Refresh
        </button>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <label for="attendance-search" class="form-label fw-semibold">Search employees</label>
        <input id="attendance-search" class="form-control" type="search" placeholder="Search by employee name or ID">
    </div>
</div>

<section class="card shadow-sm mb-4">
    <div class="card-header bg-white py-3">
        <h4 class="mb-0 text-primary">Today's Attendance</h4>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>Date</th>
                    <th>IN</th>
                    <th>OUT</th>
                    <th>Total Hours</th>
                </tr>
            </thead>
            <tbody id="today-table-body"></tbody>
        </table>
    </div>
    <div class="card-body d-flex justify-content-between align-items-center">
        <small id="today-table-info" class="text-secondary"></small>
        <nav aria-label="Today's attendance pages"><ul id="today-pagination" class="pagination pagination-sm mb-0"></ul></nav>
    </div>
</section>

<section class="card shadow-sm">
    <div class="card-header bg-white py-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <h4 class="mb-0 text-secondary">Previous Attendance</h4>
        <div class="d-flex flex-wrap align-items-center gap-2">
            <label for="history-date-range" class="small text-secondary">Date range</label>
            <select id="history-date-range" class="form-select form-select-sm" style="width: 150px;">
                <option value="all" selected>All</option>
                <option value="yesterday">Yesterday</option>
                <option value="last_7_days">Last 7 Days</option>
                <option value="this_month">This Month</option>
                <option value="custom">Custom range</option>
            </select>
            <div id="custom-date-range" class="d-none align-items-center gap-2">
                <div class="dropdown">
                    <button id="history-start-date-btn" class="btn btn-outline-secondary btn-sm dropdown-toggle text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">Start Date</button>
                    <div class="dropdown-menu p-3 shadow" style="min-width: 300px;">
                        <div id="history-start-calendar"></div>
                    </div>
                </div>
                <input id="history-start-date" type="hidden">
                
                <span class="small text-secondary">to</span>
                
                <div class="dropdown">
                    <button id="history-end-date-btn" class="btn btn-outline-secondary btn-sm dropdown-toggle text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">End Date</button>
                    <div class="dropdown-menu p-3 shadow" style="min-width: 300px;">
                        <div id="history-end-calendar"></div>
                    </div>
                </div>
                <input id="history-end-date" type="hidden">
            </div>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>Date</th>
                    <th>IN</th>
                    <th>OUT</th>
                    <th>Total Hours</th>
                </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
        </table>
    </div>
    <div class="card-body d-flex justify-content-between align-items-center">
        <small id="history-table-info" class="text-secondary"></small>
        <nav aria-label="Previous attendance pages"><ul id="history-pagination" class="pagination pagination-sm mb-0"></ul></nav>
    </div>
</section>

<script>
    const PAGE_SIZE = 25;
    const savedFilters = new URLSearchParams(window.location.search);
    const sharedFilters = {
        search: savedFilters.get('search') || '',
        employees: savedFilters.get('employees') || '',
        dates: savedFilters.get('dates') || '',
        weeks: savedFilters.get('weeks') || '',
        months: savedFilters.get('months') || ''
    };
    const todayState = { page: 1, ...sharedFilters };
    const historyState = { page: 1, ...sharedFilters, dateRange: 'all' };
    document.getElementById('attendance-search').value = sharedFilters.search;

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[character]));

    function buildQuery(state, isHistory) {
        const query = new URLSearchParams({ page: state.page, limit: PAGE_SIZE });
        if (state.search) query.set('search', state.search);
        if (state.employees) query.set('employees', state.employees);
        if (state.weeks) query.set('weeks', state.weeks);
        if (state.months) query.set('months', state.months);
        if (isHistory) {
            query.set('date_range', state.dateRange);
            if (state.dateRange === 'custom') {
                query.set('start_date', document.getElementById('history-start-date').value);
                query.set('end_date', document.getElementById('history-end-date').value);
            }
        }
        if (state.dates) {
            query.set('dates', state.dates);
            query.set('date_range', 'selected_dates');
        }
        return query;
    }

    function renderRows(tableName, records, emptyMessage) {
        const body = document.getElementById(`${tableName}-table-body`);
        if (!records.length) {
            body.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">${emptyMessage}</td></tr>`;
            return;
        }
        body.innerHTML = records.map(record => `
            <tr>
                <td>${escapeHtml(record.employee_id)}</td>
                <td class="fw-semibold text-primary">${tableName === 'today' ? `<button type="button" class="btn btn-link p-0 fw-semibold text-primary text-decoration-none employee-search" data-employee-name="${escapeHtml(record.employee_name)}" title="Search for ${escapeHtml(record.employee_name)}">${escapeHtml(record.employee_name)}</button>` : escapeHtml(record.employee_name)}</td>
                <td>${escapeHtml(record.date || '-')}</td>
                <td>${escapeHtml(record.in_time || '-')}</td>
                <td>${escapeHtml(record.out_time || '-')}</td>
                <td>${escapeHtml(record.total_hours || '-')}</td>
            </tr>
        `).join('');
    }

    function renderPagination(tableName, state, pages) {
        const pagination = document.getElementById(`${tableName}-pagination`);
        if (pages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        pagination.innerHTML = `
            <li class="page-item ${state.page === 1 ? 'disabled' : ''}">
                <button class="page-link" type="button" onclick="changePage('${tableName}', ${state.page - 1})">Previous</button>
            </li>
            <li class="page-item disabled"><span class="page-link">${state.page} / ${pages}</span></li>
            <li class="page-item ${state.page === pages ? 'disabled' : ''}">
                <button class="page-link" type="button" onclick="changePage('${tableName}', ${state.page + 1})">Next</button>
            </li>`;
    }

    async function loadTable(tableName, forceRefresh = false) {
        const isHistory = tableName === 'history';
        const state = isHistory ? historyState : todayState;
        const url = isHistory ? '/api/attendance/history/' : '/api/attendance/today/';
        const emptyMessage = isHistory ? 'No previous attendance records found.' : 'No attendance records found for today.';

        try {
            const query = buildQuery(state, isHistory);
            if (forceRefresh) query.set('refresh', '1');
            const response = await fetch(`${url}?${query}`, { cache: forceRefresh ? 'no-store' : 'default' });
            if (!response.ok) throw new Error('Unable to load attendance records.');
            const data = await response.json();
            renderRows(tableName, data.records, emptyMessage);

            const firstRecord = data.total_count ? (data.page - 1) * data.limit + 1 : 0;
            const lastRecord = Math.min(data.page * data.limit, data.total_count);
            document.getElementById(`${tableName}-table-info`).textContent = `Showing ${firstRecord}-${lastRecord} of ${data.total_count}`;
            renderPagination(tableName, state, data.pages);
        } catch (error) {
            renderRows(tableName, [], error.message);
            document.getElementById(`${tableName}-table-info`).textContent = '';
        }
    }

    function changePage(tableName, page) {
        const state = tableName === 'history' ? historyState : todayState;
        if (page < 1) return;
        state.page = page;
        loadTable(tableName);
    }

    async function refreshDashboard(forceRefresh = false) {
        const button = document.getElementById('refresh-button');
        if (button) {
            button.disabled = true;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>Refreshing';
        }
        if (forceRefresh) {
            // Reload the workbook once, then render both tables from that same fresh snapshot.
            await loadTable('today', true);
            await loadTable('history');
        } else {
            await Promise.all([loadTable('today'), loadTable('history')]);
        }
        if (button) {
            button.disabled = false;
            button.innerHTML = '<i class="fa-solid fa-arrows-rotate me-1"></i>Refresh';
        }
    }

    document.getElementById('today-table-body').addEventListener('click', event => {
        const employeeButton = event.target.closest('.employee-search');
        if (!employeeButton) return;

        const employeeName = employeeButton.dataset.employeeName;
        document.getElementById('attendance-search').value = employeeName;
        todayState.search = employeeName;
        historyState.search = employeeName;
        todayState.page = 1;
        historyState.page = 1;
        refreshDashboard();
    });

    document.getElementById('attendance-search').addEventListener('input', event => {
        todayState.search = event.target.value.trim();
        historyState.search = event.target.value.trim();
        todayState.page = 1;
        historyState.page = 1;
    });

    document.getElementById('attendance-search').addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            refreshDashboard();
        }
    });

    document.getElementById('history-date-range').addEventListener('change', event => {
        historyState.dateRange = event.target.value;
        historyState.page = 1;
        document.getElementById('custom-date-range').classList.toggle('d-none', event.target.value !== 'custom');
        document.getElementById('custom-date-range').classList.toggle('d-flex', event.target.value === 'custom');
        loadTable('history');
    });

    let startCalendar = null;
    let endCalendar = null;
    let allAvailableDates = [];

    async function initDashboardCalendars() {
        try {
            const response = await fetch('/api/filters/');
            if (!response.ok) return;
            const data = await response.json();
            allAvailableDates = data.available_dates.map(d => d.value);
            
            // Initialize Start Date Calendar
            startCalendar = new CalendarPicker('history-start-calendar', {
                selectedDates: [],
                availableDates: allAvailableDates,
                multiSelect: false,
                onSelect: (selectedDates) => {
                    const dateStr = [...selectedDates][0];
                    const btn = document.getElementById('history-start-date-btn');
                    if (dateStr) {
                        const parts = dateStr.split('-');
                        btn.textContent = `${parts[2]}-${parts[1]}-${parts[0]}`;
                        document.getElementById('history-start-date').value = dateStr;
                    } else {
                        btn.textContent = 'Start Date';
                        document.getElementById('history-start-date').value = '';
                    }
                    historyState.page = 1;
                    loadTable('history');
                },
                onClear: () => {
                    document.getElementById('history-start-date-btn').textContent = 'Start Date';
                    document.getElementById('history-start-date').value = '';
                    historyState.page = 1;
                    loadTable('history');
                }
            });
            
            // Initialize End Date Calendar
            endCalendar = new CalendarPicker('history-end-calendar', {
                selectedDates: [],
                availableDates: allAvailableDates,
                multiSelect: false,
                onSelect: (selectedDates) => {
                    const dateStr = [...selectedDates][0];
                    const btn = document.getElementById('history-end-date-btn');
                    if (dateStr) {
                        const parts = dateStr.split('-');
                        btn.textContent = `${parts[2]}-${parts[1]}-${parts[0]}`;
                        document.getElementById('history-end-date').value = dateStr;
                    } else {
                        btn.textContent = 'End Date';
                        document.getElementById('history-end-date').value = '';
                    }
                    historyState.page = 1;
                    loadTable('history');
                },
                onClear: () => {
                    document.getElementById('history-end-date-btn').textContent = 'End Date';
                    document.getElementById('history-end-date').value = '';
                    historyState.page = 1;
                    loadTable('history');
                }
            });
        } catch (e) {
            console.error("Error initializing dashboard calendars:", e);
        }
    }

    initDashboardCalendars();

    renderRows('today', [], 'Loading today\'s attendance records...');
    renderRows('history', [], 'Loading previous attendance records...');
    document.getElementById('today-table-info').textContent = 'Loading...';
    document.getElementById('history-table-info').textContent = 'Loading...';

    const isInitialRefresh = savedFilters.get('refresh') === '1';
    if (isInitialRefresh) {
        savedFilters.delete('refresh');
        const query = savedFilters.toString();
        window.history.replaceState({}, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
    }
    refreshDashboard(isInitialRefresh);

    // Live Mode polling implementation
    let liveModeInterval = null;
    let lastKnownMtime = null;
    let lastKnownRecordCount = null;

    async function checkExcelUpdates() {
        try {
            const response = await fetch('/api/attendance/status/');
            if (!response.ok) return;
            const data = await response.json();
            
            if (lastKnownMtime === null) {
                lastKnownMtime = data.mtime;
                lastKnownRecordCount = data.record_count;
                return;
            }
            
            if (data.mtime !== lastKnownMtime || data.record_count !== lastKnownRecordCount) {
                lastKnownMtime = data.mtime;
                lastKnownRecordCount = data.record_count;
                await refreshDashboard(false);
                showNotification("Attendance data updated from Excel sheet.");
            }
        } catch (e) {
            console.error("Error checking Excel updates:", e);
        }
    }

    function toggleLiveMode() {
        const btn = document.getElementById('live-button');
        const dot = document.getElementById('live-dot');
        const isActive = btn.classList.contains('btn-danger');
        
        if (isActive) {
            // Turn OFF Live mode
            btn.classList.remove('btn-danger', 'text-white');
            btn.classList.add('btn-outline-danger');
            dot.classList.remove('bg-white', 'animate-pulse');
            dot.classList.add('bg-danger');
            
            if (liveModeInterval) {
                clearInterval(liveModeInterval);
                liveModeInterval = null;
            }
        } else {
            // Turn ON Live mode
            btn.classList.remove('btn-outline-danger');
            btn.classList.add('btn-danger', 'text-white');
            dot.classList.remove('bg-danger');
            dot.classList.add('bg-white', 'animate-pulse');
            
            fetch('/api/attendance/status/')
                .then(res => res.json())
                .then(data => {
                    lastKnownMtime = data.mtime;
                    lastKnownRecordCount = data.record_count;
                })
                .catch(console.error);
                
            liveModeInterval = setInterval(checkExcelUpdates, 3000);
            refreshDashboard(false);
        }
    }

    function showNotification(message) {
        let toastContainer = document.getElementById('toast-container');
        if (!toastContainer) {
            toastContainer = document.createElement('div');
            toastContainer.id = 'toast-container';
            toastContainer.className = 'position-fixed bottom-0 end-0 p-3';
            toastContainer.style.zIndex = '1055';
            document.body.appendChild(toastContainer);
        }
        
        const toastId = 'toast-' + Date.now();
        const toastHtml = `
            <div id="${toastId}" class="toast align-items-center text-white bg-success border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="fa-solid fa-circle-check me-2"></i>${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        `;
        
        toastContainer.insertAdjacentHTML('beforeend', toastHtml);
        const toastEl = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
        toast.show();
        
        toastEl.addEventListener('hidden.bs.toast', () => {
            toastEl.remove();
        });
    }
</script>
{% endblock %}
